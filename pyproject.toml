[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "growrag"
version = "0.4.0"
description = "Research harness for safe reuse of historically validated query transformations in RAG."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "License not selected yet" }
authors = [{ name = "GrowRAG Research Project" }]
dependencies = []

[project.scripts]
growrag = "growrag.cli:main"

[project.optional-dependencies]
qpp = [
  "scikit-learn>=1.5,<2",
]
experiments = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.9,<3",
  "ranx>=0.3.20,<0.4",
  "rich>=13.9,<15",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
bm25 = [
  "rank-bm25>=0.2.2,<0.3",
]
dense = [
  "sentence-transformers>=3.3,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/growrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
